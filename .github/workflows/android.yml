name: Android build

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ubuntu-latest runners ship a pre-installed Android SDK, but not
      # necessarily this project's exact platform/build-tools versions.
      # Installing them directly (rather than via android-actions/setup-android,
      # which also tries to install a "tools" package Google removed years
      # ago, and fails outright when it can't find it) only adds what's
      # actually missing.
      - name: Install the Android SDK platform and build-tools this project needs
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -path "*/bin/*" | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ummi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
